# CloudBridge Enterprise
# Example inventory - replace placeholders with your own values.

[onprem_linux]
onprem_vm1 ansible_host=192.0.2.10 ansible_user=your_username ansible_port=22 ansible_ssh_private_key_file=~/.ssh/your_private_key

[onprem_linux:vars]
ansible_ssh_common_args='-o IdentitiesOnly=yes -o ConnectTimeout=10'
